<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glassmorphism Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Vibrant gradient background to make the glass visible */
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      overflow: hidden;
      position: relative;
      color: #ffffff;
    }

    /* Decorative background blobs to show off the blur */
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      z-index: 0;
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      background: linear-gradient(45deg, #ff007f, #ff8c00);
      top: 15%;
      left: 25%;
    }

    .circle-2 {
      width: 250px;
      height: 250px;
      background: linear-gradient(45deg, #00d2ff, #3a7bd5);
      bottom: 15%;
      right: 25%;
    }

    /* Frosted Glass Card */
    .glass-card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 400px;
      padding: 2.5rem;
      
      /* Core Glassmorphism Properties */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .glass-card h2 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }

    .glass-card p {
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 1.5rem;
    }

    .glass-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <!-- Background Shapes -->
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <!-- Glass Card -->
  <div class="glass-card">
    <h2>Frosted Glass</h2>
    <p>
      Notice how the colorful shapes behind this card smoothly diffuse through the translucent surface.
    </p>
    <a href="#" class="glass-btn">Test Button</a>
  </div>

</body>
</html>
