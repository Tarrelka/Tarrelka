<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarelka web • about me</title>
  <script type="module" src="https://ascii.rest/ascii.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;      /* по центру по вертикали */
      justify-content: flex-start; /* прижато к левому краю */
      padding: 24px 24px 24px clamp(24px, 6vw, 90px); /* отступ от левого края */
      background: #0f172a;
      overflow-x: hidden;
      position: relative;
      color: #ffffff;
    }

    .background-video {
      position: fixed;
      inset: -8px;
      width: calc(100% + 16px);
      height: calc(100% + 16px);
      object-fit: cover;
      object-position: center;
      filter: blur(3px);
      z-index: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      z-index: 1;
    }

    .page-layout {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 380px;
    }

    .glass-card,
    .social-box {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .glass-card {
      padding: 2rem 1.75rem;
      text-align: center;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 14px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .glass-card h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    .glass-card p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.82);
    }

    .social-box {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .ascii-card {
      position: fixed;
      right: clamp(24px, 6vw, 90px);
      top: clamp(24px, 6vw, 90px);
      width: 380px;
      max-width: calc(100vw - 48px);
    }

    .black-hole-card {
      position: fixed;
      right: clamp(24px, 6vw, 90px);
      bottom: clamp(24px, 6vw, 90px);
      width: 320px;
      max-width: calc(100vw - 48px);
      padding: 1rem;
    }

    .black-hole-card ascii-art {
      font-size: 7px;
    }

    /* На телефоне возвращаем по центру и сглаживаем зум видео */
    @media (max-width: 640px) {
      body {
        justify-content: center;
        padding: 16px;
      }

      .background-video {
        filter: blur(10px) saturate(1.2);
      }

      body::before {
        background: rgba(15, 23, 42, 0.48);
      }

      .ascii-card {
        position: static;
        width: 100%;
        max-width: 380px;
        transform: none;
      }

      .black-hole-card {
        position: static;
        width: 100%;
        max-width: 320px;
      }

      .black-hole-card ascii-art {
        font-size: 6px;
      }
    }

    @media (max-aspect-ratio: 9/16) {
      .black-hole-card {
        display: none;
      }
    }
  </style>
</head>
<body>

  <video class="background-video" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <main class="page-layout">
    <section class="glass-card">
      <img src="avatar.png" alt="Avatar" class="avatar">
      <h2>Hello! i'm tarelka</h2>
      <p>vibecoded</p>
    </section>

    <nav class="social-box" aria-label="Social media links">
      <h3 style="text-align: center; margin-bottom: 10px;">Socials</h3>
      <a href="https://t.me/username" class="social-btn" target="_blank" rel="noopener">Telegram</a>
      <a href="https://tiktok.com/@username" class="social-btn" target="_blank" rel="noopener">TikTok</a>
      <a href="https://github.com/username" class="social-btn" target="_blank" rel="noopener">GitHub( lmao why u need this shi)</a>
      <a href="https://youtube.com/username" class="social-btn" target="_blank" rel="noopener">YouTube</a>
      <a href="https://steamcommunity.com/id/username" class="social-btn" target="_blank" rel="noopener">Steam</a>
    </nav>
    
    <!-- new card = a ASCII card-->
     <div class="glass-card ascii-card">
      <h3 style="text-align: center; margin-bottom: 10px;">cool card (us)</h3>
      <pre style="font-size: 1.85rem; line-height: 1.2; color: rgba(255, 255, 255, 0.82);">
            へ     ♡   ╱|、
      ૮  -   ՛ )      (`   -  7 
     /   ⁻  ៸|       |、⁻〵
    乀 (ˍ, ل ل       じしˍ,)ノ
      </pre>
    </div>

    <div class="glass-card black-hole-card">
      <h3 style="text-align: center; margin-bottom: 10px;">Black hole</h3>
      <ascii-art piece="black-hole" options='{"motion":true}'></ascii-art>
    </div>

  </main>

</body>
</html>
