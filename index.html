<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>имя</title>
  <style>
    /* Фон страницы */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 25% 20%, rgba(56, 189, 248, 0.25), transparent 45%),
        radial-gradient(circle at 75% 75%, rgba(168, 85, 247, 0.22), transparent 45%),
        linear-gradient(150deg, #090d16 0%, #111827 100%);
    }

    /* Стеклянная карточка */
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    /* Тестовые кнопки */
    .buttons {
      display: grid;
      gap: 10px;
    }

    .btn {
      display: block;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>имя</h1>
    <nav class="buttons">
      <a class="btn" href="#">Тестовая кнопка 1</a>
      <a class="btn" href="#">Тестовая кнопка 2</a>
      <a class="btn" href="#">Тестовая кнопка 3</a>
    </nav>
  </main>
</body>
</html>
